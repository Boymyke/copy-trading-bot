<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gold Copy Trader</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#07080a;--card:#101114;--line:#23252b;--muted:#8b8f98;--text:#f2f3f5;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1240px;margin:auto;padding:22px 16px 40px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:24px;margin:0}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.badge{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px;color:var(--muted)}
button{background:#181a1f;color:var(--text);border:1px solid #33363d;border-radius:9px;padding:8px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:0 0 9px;font-weight:600}
.value{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.idle{background:#555}
.small{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5;overflow-wrap:anywhere}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.section{margin-top:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--muted);font-weight:600;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #1a1c21;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.events{max-height:440px;overflow:auto}.event{padding:9px 0;border-bottom:1px solid #1a1c21}.event .meta{font-size:11px;color:#6b6f78;margin-bottom:3px}.event .msg{font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.event.error .msg{color:var(--bad)}.event.warning .msg{color:var(--warn)}
.warnbox{border:1px solid #5a4510;background:#1a1508;color:#f3d38a;border-radius:12px;padding:12px 14px;font-size:13px;margin-top:12px;display:none}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">MetaApi CopyFactory executes · Railway monitors</div><h1>Gold Copy Trader <span id="ver"></span></h1></div>
    <div><span id="updated" class="badge">Loading…</span> <button onclick="load()">Refresh</button></div>
  </div>
  <div class="grid">
    <div class="card"><h3>Source account</h3><div id="src" class="value">—</div><div id="srcSub" class="small"></div></div>
    <div class="card"><h3>Target account</h3><div id="tgt" class="value">—</div><div id="tgtSub" class="small"></div></div>
    <div class="card"><h3>CopyFactory</h3><div id="cf" class="value">—</div><div id="cfSub" class="small"></div></div>
    <div class="card"><h3>Copying</h3><div id="copy" class="value">—</div><div id="copySub" class="small"></div></div>
  </div>
  <div class="grid section">
    <div class="card"><h3>Route &amp; lot</h3><div id="lot" class="value">—</div><div id="route" class="small"></div></div>
    <div class="card"><h3>Source / target open</h3><div id="count" class="value">—</div><div id="countSub" class="small"></div></div>
    <div class="card"><h3>Sync</h3><div id="sync" class="value">—</div><div id="syncSub" class="small"></div></div>
    <div class="card"><h3>Monitor</h3><div id="mon" class="value">—</div><div id="monSub" class="small"></div></div>
  </div>
  <div id="warnbox" class="warnbox"></div>
  <div class="two">
    <div class="card"><h3>Source positions</h3><div class="tbl"><table><thead><tr><th>#</th><th>Side</th><th>Lot</th><th>Entry</th><th>P/L</th></tr></thead><tbody id="srcPos"></tbody></table></div></div>
    <div class="card"><h3>Target positions</h3><div class="tbl"><table><thead><tr><th>#</th><th>Side</th><th>Lot</th><th>Entry</th><th>P/L</th></tr></thead><tbody id="tgtPos"></tbody></table></div></div>
  </div>
  <div class="card section"><h3>Recent events &amp; errors</h3><div id="events" class="events"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){if(v===null||v===undefined||v==='')return '—';v=Number(v);return `<span class="${v>=0?'ok':'bad'}">${v>=0?'+':'-'}$${Math.abs(v).toFixed(2)}</span>`}
function dot(c){return `<span class="dot ${c}"></span>`}
function ago(ts){if(!ts)return 'never';const s=Math.max(0,Math.round(Date.now()/1000-ts));return s<60?s+'s ago':s<3600?Math.round(s/60)+'m ago':Math.round(s/3600)+'h ago'}
function acct(el,sub,a){
  if(!a){$(el).innerHTML=dot('idle')+'Checking';$(sub).textContent='';return}
  if(a.error){$(el).innerHTML=dot('bad')+'<span class="bad">Error</span>';$(sub).textContent=a.error;return}
  $(el).innerHTML=dot(a.connected?'ok':'bad')+`<span class="${a.connected?'ok':'bad'}">${esc(a.connectionStatus||'?')}</span>`;
  $(sub).textContent=`${a.name||a.id} · ${a.state||'?'} · ${a.region||'?'} · ${(a.copyFactoryRoles||[]).join(', ')||'no role'}`;
}
function rows(list){return (list||[]).map(p=>`<tr><td>${esc(p.id)}</td><td><b>${esc(p.side)}</b></td><td>${Number(p.volume).toFixed(2)}</td><td>${esc(p.openPrice)}</td><td>${money(p.profit)}</td></tr>`).join('')||'<tr><td colspan="5" class="small">None open.</td></tr>'}
async function load(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const s=await r.json();
    const cf=s.copyFactory, st=cf.status||{}, mon=s.monitor, acc=s.accounts||{};
    $('ver').textContent='v'+s.version;
    acct('src','srcSub',acc.source); acct('tgt','tgtSub',acc.target);
    $('cf').innerHTML=cf.active?dot('ok')+'<span class="ok">ACTIVE</span>':cf.ready?dot('warn')+'<span class="warn">Not active</span>':dot('bad')+'<span class="bad">Not ready</span>';
    $('cfSub').textContent=cf.ready?`'${st.strategyName}' → '${st.subscriberName}' · checked ${ago(cf.checkedAt)}`:(cf.error||'Checking…');
    if(cf.paused===null){$('copy').innerHTML=dot('idle')+'Unknown';$('copySub').textContent='Not read yet'}
    else{$('copy').innerHTML=cf.paused?dot('warn')+'<span class="warn">Paused</span>':dot('ok')+'<span class="ok">On</span>';$('copySub').textContent=cf.paused?'closeOnly='+(st.closeOnly||'?'):'Source open → target open · source close → target close'}
    const ts=st.tradeSize||{};$('lot').textContent=Number(cf.lot).toFixed(2);
    $('route').textContent=`${cf.sourceSymbol} → ${cf.targetSymbol} · ${ts.mode||'?'} · SL/TP copied ${st.copyStopLoss?'yes':'no'}/${st.copyTakeProfit?'yes':'no'}`;
    $('count').textContent=`${mon.sourcePositions.length} / ${mon.targetPositions.length}`;
    $('countSub').textContent=mon.otherTargetPositions?`${mon.otherTargetPositions} other-symbol position(s) on target ignored`:'';
    $('sync').innerHTML=mon.inSync?dot('ok')+'<span class="ok">In sync</span>':dot('warn')+'<span class="warn">Out of sync</span>';
    $('syncSub').textContent=mon.syncDetail||'Every source trade has its target copy';
    $('mon').innerHTML=mon.online?dot('ok')+'<span class="ok">OK</span>':mon.rateLimitedUntil?dot('warn')+'<span class="warn">Rate-limited</span>':dot('bad')+'<span class="bad">Retrying</span>';
    $('monSub').textContent=mon.online?`read ${ago(mon.lastOkAt)} · every ${mon.pollSeconds}s · ${mon.restRequests} reads / ${mon.restErrors} errors`:(mon.lastError||'Starting…');
    $('srcPos').innerHTML=rows(mon.sourcePositions); $('tgtPos').innerHTML=rows(mon.targetPositions);
    const w=st.warnings||[]; $('warnbox').style.display=w.length?'block':'none'; $('warnbox').innerHTML='<b>Needs attention (not changed by the bot):</b><br>'+w.map(esc).join('<br>');
    $('events').innerHTML=(s.events||[]).map(e=>`<div class="event ${esc(e.level)}"><div class="meta">${esc(e.created_at)} · ${esc(e.level)} · ${esc(e.kind)}</div><div class="msg">${esc(e.message)}</div></div>`).join('')||'<div class="small">No events yet.</div>';
    $('updated').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){$('updated').textContent='Dashboard error: '+e.message}
}
load();setInterval(load,10000);
</script>
</body>
</html>
